# Los tests no tocan la red ni necesitan el índice construido: se apoyan en bases temporales.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ejecutar la batería completa
        run: python -m unittest discover -s tests -v
      - name: Validar el banco de evaluación contra su esquema
        run: python bench/validar.py bench/preguntas.json
